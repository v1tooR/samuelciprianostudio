<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Capa de compartilhamento — Samuel Cipriano Studio</title>
  <link rel="stylesheet" href="https://use.typekit.net/elq3gla.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { background: #F2EBE7; color: #034638; font-family: 'neue-haas-grotesk-display', 'Helvetica Neue', Arial, sans-serif; }
    .card { position: relative; height: 100%; isolation: isolate; overflow: hidden; }
    .flora { position: absolute; z-index: -1; height: 550px; width: auto; }
    .left { left: -108px; bottom: -154px; transform: rotate(-13deg); }
    .right { right: -114px; top: -187px; height: 590px; transform: rotate(163deg); }
    .brand { position: absolute; width: 790px; top: 176px; left: 205px; }
    .promise { position: absolute; top: 392px; left: 228px; width: 744px; margin: 0; text-align: center; font: italic 100 36px/1.2 'ivypresto-display', Georgia, serif; }
    .services { position: absolute; bottom: 46px; left: 300px; width: 600px; margin: 0; text-align: center; font-size: 18px; font-weight: 400; }
    .project-photo { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .project .project-photo { display: block; }
    .project .flora, .project .brand, .project .promise, .project .services { display: none; }
    .project::before { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(16,24,32,.9), transparent 72%); z-index: -1; }
    .project-name, .project-scope, .project-brand { display: none; }
    .project .project-name { display: block; position: absolute; left: 68px; bottom: 115px; max-width: 1064px; margin: 0; color: #F2EBE7; font: 100 68px/1.08 'ivypresto-display', Georgia, serif; }
    .project .project-scope { display: block; position: absolute; left: 70px; bottom: 67px; margin: 0; color: #F2EBE7; font-size: 23px; }
    .project .project-brand { display: block; position: absolute; left: 70px; top: 42px; width: 238px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="flora left" src="../../assets/flora/vermelha-04.webp" alt="">
    <img class="flora right" src="../../assets/flora/vermelha-01.webp" alt="">
    <img class="brand" src="../../assets/logotipo-verde.svg" alt="Samuel Cipriano Studio">
    <p class="promise">Construímos marcas diferentes,<br>relevantes e desejadas.</p>
    <p class="services">Estratégia de marca · Identidade verbal · Identidade visual</p>
    <img class="project-photo" alt="">
    <img class="project-brand" src="../../assets/lockup-bone.svg" alt="Samuel Cipriano Studio">
    <p class="project-name"></p>
    <p class="project-scope"></p>
  </div>
</body>
</html>
